  <div style="margin-left: 15px; margin-right: 15px;">

      aria-valuemax="100">
      <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 75%" id="progresso">
        75%
      </div>
    </div>
  </div>

  <div class="accordion" id="accordionExample" style="margin: 15px;">
    <div class="accordion-item">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"

      </h2>
      <div id="panelsStayOpen-collapseOne" class="accordion-collapse collapse">
        <div class="accordion-body">

          <p style="text-align: center;">Axis <b>Dates</b> Range Limit</p>
          <div id="slider" style="margin-left: 40px; margin-right: 40px;"></div>

          <form action="/download/{{folder_name}}" class="row g-4" style="margin: 15 15 15 15;">

              <button class="btn btn-info" id="submit_button" style="color: white;" type="submit"><b>Download Sensors
                Data</b></button>
            </div>
          </form>

          <div class="row row-cols-2 row-cols-md-2 g-2" id="first_cards" style="margin: 15px">
            <div class="col">
              <div class="card">
                <canvas id="corrente" width="100%" height="50%"></canvas>
                <div class="card-body">
                  <h5 class="card-title" style="text-align: center;">Corrente</h5>
                  <p class="card-text placeholder-glow">
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card">
                <canvas id="tensao" width="100%" height="50%"></canvas>
                <div class="card-body">
                  <h5 class="card-title" style="text-align: center;">Tensão</h5>
                  <p class="card-text placeholder-glow">
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card">
                <canvas id="temperatura" width="100%" height="50%"></canvas>

                  <h5 class="card-title" style="text-align: center;">Temperatura</h5>
                  <p class="card-text placeholder-glow">
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card">
                <!-- TODO: BOTAR O CANVA AQUI -->
                <canvas id="rpm" width="100%" height="50%"></canvas>
                <div class="card-body">
                  <h5 class="card-title" style="text-align: center;">RPM</h5>
                  <p class="card-text placeholder-glow">
                  </p>
                </div>
              </div>
            </div>
            <div class="col">
              <div class="card">

                  <p class="card-text placeholder-glow">
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="accordion-item">

      <div id="panelsStayOpen-collapseTwo" class="accordion-collapse collapse">

  <script>
    var dado = JSON.parse("{{data}}".replaceAll("&#39;", '"'))
    var folder_name = "{{folder_name}}";
    var graph_data = null;
    var graph_data_cache = null;
  </script>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
